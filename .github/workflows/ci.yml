# Spec §18. Runs only for PRs into main; pushes to main and tags are tested through release.yml (workflow_call).
name: ci

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  # The .NET tests in shards, one job each (scripts/test-dotnet.ps1 defines them; -ExpectedShards fails the job if
  # the script and this matrix disagree). The slowest shard sets the pace.
  backend-shard:
    name: backend (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore -warnaserror
      # Includes Testcontainers tests (Docker is available on ubuntu runners).
      - run: pwsh scripts/test-dotnet.ps1 -Shard ${{ matrix.shard }} -ExpectedShards 4 -Configuration Release -NoBuild -Coverage -ResultsDirectory ./coverage-raw
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-${{ matrix.shard }}
          path: coverage-raw/*/coverage.cobertura.xml
          if-no-files-found: ignore
          retention-days: 1

  # Branch protection requires a check named "backend"; this reports the shards as one.
  backend:
    needs: backend-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.backend-shard.result }}" = success

  coverage:
    needs: backend-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet tool restore
      - uses: actions/download-artifact@v7
        with:
          pattern: coverage-*
          path: coverage-raw
      - name: Coverage summary
        run: |
          if find ./coverage-raw -name coverage.cobertura.xml 2>/dev/null | grep -q .; then
            dotnet reportgenerator -reports:"./coverage-raw/**/coverage.cobertura.xml" -targetdir:./coverage -reporttypes:MarkdownSummaryGithub
            cat ./coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No coverage files." >> "$GITHUB_STEP_SUMMARY"
          fi

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/RnRomManager.Web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/RnRomManager.Web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build

  # Independent of the other jobs (it builds its own image), so it runs alongside them.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - uses: docker/setup-buildx-action@v4
      # The amd64 image, reusing cached layers (npm ci, dotnet restore) from earlier e2e and release builds. The version
      # is the Dockerfile default; nothing in e2e reads it.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: niemandr/rnrommanager:e2e
          cache-from: |
            type=gha,scope=e2e
            type=gha
          cache-to: type=gha,scope=e2e,mode=max
      # Seeds Basic, runs Playwright + axe against docker-compose.e2e.yml, tears down.
      - run: pwsh scripts/test-e2e.ps1 -SkipBuild
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          retention-days: 14
