# Spec §18. Runs only for PRs into main; pushes to main and tags are tested through release.yml (workflow_call).
name: ci

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  # The .NET tests in shards, one job each (scripts/test-dotnet.ps1 defines them; -ExpectedShards fails the job if
  # the script and this matrix disagree). The slowest shard sets the pace.
  backend-shard:
    name: backend (${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      # Includes Testcontainers tests (Docker is available on ubuntu runners).
      - run: pwsh scripts/test-dotnet.ps1 -Shard ${{ matrix.shard }} -ExpectedShards 8 -Configuration Release -Coverage -ResultsDirectory ./coverage-raw
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-${{ matrix.shard }}
          path: |
            coverage-raw/*/coverage.cobertura.xml
            coverage-raw/*.trx
          if-no-files-found: ignore
          retention-days: 1

  # Branch protection requires a check named "backend"; this reports the shards as one.
  backend:
    needs: backend-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.backend-shard.result }}" = success

  coverage:
    needs: backend-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet tool restore
      - uses: actions/download-artifact@v7
        with:
          pattern: coverage-*
          path: coverage-raw
      - name: Coverage summary
        run: |
          if find ./coverage-raw -name coverage.cobertura.xml 2>/dev/null | grep -q .; then
            dotnet reportgenerator -reports:"./coverage-raw/**/coverage.cobertura.xml" -targetdir:./coverage -reporttypes:MarkdownSummaryGithub
            cat ./coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No coverage files." >> "$GITHUB_STEP_SUMMARY"
          fi

  # The web unit tests (~115 s) and the lint, type check and build (~45 s) run side by side.
  web-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/RnRomManager.Web
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/web-setup
      - run: npm test

  web-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/RnRomManager.Web
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/web-setup
      - run: npm run lint
      - run: npm run check
      - run: npm run build

  # Branch protection requires a check named "web"; this reports the two web jobs as one.
  web:
    needs: [web-test, web-check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.web-test.result }}" = success && test "${{ needs.web-check.result }}" = success

  # docs/codemap.md must match the code (scripts/codemap.ps1 regenerates it; every change commits it).
  codemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: pwsh scripts/codemap.ps1 -Check

  # Independent of the other jobs (it builds its own image), so it runs alongside them.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      # The browser download for test-e2e.ps1's `playwright install` (its version follows the lock file).
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/e2e/package-lock.json') }}
      # Compiles the seeding tool while the image builds; waited for below. A failed build shows up when seeding runs it.
      - run: dotnet build tests/RnRomManager.TestData > "$RUNNER_TEMP/seed-build.log" 2>&1 & echo $! > "$RUNNER_TEMP/seed-build.pid"
      - uses: docker/setup-buildx-action@v4
      # The amd64 image, reusing cached layers (npm ci, dotnet restore) from release builds on main (release.yml's
      # docker-cache job). The version is the Dockerfile default; nothing in e2e reads it.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: niemandr/rnrommanager:e2e
          cache-from: type=gha
      - run: |
          while kill -0 "$(cat "$RUNNER_TEMP/seed-build.pid")" 2>/dev/null; do sleep 1; done
          tail -n 3 "$RUNNER_TEMP/seed-build.log"
      # Seeds Basic, runs Playwright + axe against docker-compose.e2e.yml, tears down.
      - run: pwsh scripts/test-e2e.ps1 -SkipBuild
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          retention-days: 14
