<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Default box art for RnRomManager (Nintendo Entertainment System). Made for this project; MIT licensed like the
       rest of the repo. Exported to nes.png (512x512): see README.md. -->
  <rect width="512" height="512" fill="#fdf1d6"/>
  <!-- tall rectangular cartridge shell -->
  <rect x="116" y="64" width="280" height="384" rx="8" fill="#8a8a90" stroke="#3a3a40" stroke-width="4"/>
  <!-- horizontal grip ridges across the top -->
  <g stroke="#3a3a40" stroke-width="4" stroke-linecap="round" opacity="0.5">
    <line x1="140" y1="86" x2="372" y2="86"/>
    <line x1="140" y1="100" x2="372" y2="100"/>
    <line x1="140" y1="114" x2="372" y2="114"/>
  </g>
  <!-- label recess and label -->
  <rect x="136" y="134" width="240" height="210" rx="6" fill="#3a3a40" opacity="0.35"/>
  <rect x="146" y="144" width="220" height="190" rx="4" fill="#fffaf0"/>
  <rect x="146" y="144" width="220" height="40" rx="4" fill="#3a3a40"/>
  <text x="256" y="250" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="64" font-weight="800" fill="#b5651d">NES</text>
  <text x="256" y="300" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="20" font-weight="600" fill="#3a3a40">8-BIT CARTRIDGE</text>
  <!-- bottom edge with the arrow notch -->
  <path d="M236 384 L256 412 L276 384 Z" fill="#3a3a40" opacity="0.55"/>
  <rect x="150" y="424" width="212" height="12" rx="3" fill="#3a3a40" opacity="0.45"/>
</svg>
