<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Default box art for RnRomManager (GameCube). Made for this project; MIT licensed like the rest of the repo.
       Exported to gc.png (512x512): see README.md. -->
  <rect width="512" height="512" fill="#e7e3f2"/>
  <!-- cube-shaped purple console -->
  <rect x="116" y="104" width="280" height="280" rx="26" fill="#5a4a9c" stroke="#33295e" stroke-width="4"/>
  <!-- round lid -->
  <circle cx="256" cy="220" r="86" fill="#6b5bb0" stroke="#33295e" stroke-width="4"/>
  <circle cx="256" cy="220" r="22" fill="#33295e"/>
  <!-- handle -->
  <rect x="176" y="384" width="160" height="26" rx="10" fill="#33295e"/>
  <text x="256" y="356" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" fill="#ffffff">GC</text>
</svg>
