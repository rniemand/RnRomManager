<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Default box art for RnRomManager (Commodore PET). Made for this project; MIT licensed like the rest of the repo.
       A generic all-in-one computer with a built-in monitor and keyboard: no logo or trade dress. Exported to pet.png (512x512): see README.md. -->
  <rect width="512" height="512" fill="#e6ebe4"/>
  <!-- monitor housing -->
  <path d="M120 60 L392 60 Q412 60 412 80 L412 250 L100 250 L100 80 Q100 60 120 60 Z"
        fill="#d9d4c3" stroke="#6f6a58" stroke-width="5" stroke-linejoin="round"/>
  <rect x="130" y="84" width="252" height="146" rx="18" fill="#1e2a22" stroke="#3b3a32" stroke-width="6"/>
  <g fill="#7ee08f" font-family="Consolas, Courier New, monospace" font-size="18">
    <text x="150" y="118">READY.</text>
    <text x="150" y="144">LOAD</text>
    <rect x="150" y="156" width="12" height="18"/>
  </g>
  <!-- base with keyboard -->
  <path d="M100 250 L412 250 L452 396 Q456 416 436 416 L76 416 Q56 416 60 396 Z"
        fill="#c8c1aa" stroke="#6f6a58" stroke-width="5" stroke-linejoin="round"/>
  <rect x="112" y="272" width="288" height="124" rx="8" fill="#3a3f45"/>
  <g fill="#8d949b">
    <rect x="122" y="282" width="24" height="20" rx="3"/><rect x="152" y="282" width="24" height="20" rx="3"/>
    <rect x="182" y="282" width="24" height="20" rx="3"/><rect x="212" y="282" width="24" height="20" rx="3"/>
    <rect x="242" y="282" width="24" height="20" rx="3"/><rect x="272" y="282" width="24" height="20" rx="3"/>
    <rect x="122" y="308" width="24" height="20" rx="3"/><rect x="152" y="308" width="24" height="20" rx="3"/>
    <rect x="182" y="308" width="24" height="20" rx="3"/><rect x="212" y="308" width="24" height="20" rx="3"/>
    <rect x="242" y="308" width="24" height="20" rx="3"/><rect x="272" y="308" width="24" height="20" rx="3"/>
    <rect x="122" y="334" width="24" height="20" rx="3"/><rect x="152" y="334" width="24" height="20" rx="3"/>
    <rect x="182" y="334" width="24" height="20" rx="3"/><rect x="212" y="334" width="24" height="20" rx="3"/>
    <rect x="242" y="334" width="24" height="20" rx="3"/><rect x="272" y="334" width="24" height="20" rx="3"/>
    <rect x="152" y="362" width="144" height="20" rx="3"/>
  </g>
  <!-- numeric keypad -->
  <g fill="#b3b9bf">
    <rect x="312" y="282" width="24" height="20" rx="3"/><rect x="340" y="282" width="24" height="20" rx="3"/><rect x="368" y="282" width="24" height="20" rx="3"/>
    <rect x="312" y="308" width="24" height="20" rx="3"/><rect x="340" y="308" width="24" height="20" rx="3"/><rect x="368" y="308" width="24" height="20" rx="3"/>
    <rect x="312" y="334" width="24" height="20" rx="3"/><rect x="340" y="334" width="24" height="20" rx="3"/><rect x="368" y="334" width="24" height="20" rx="3"/>
    <rect x="312" y="362" width="80" height="20" rx="3"/>
  </g>
  <text x="256" y="476" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="34" font-weight="700" letter-spacing="4" fill="#2f5a3a">PET</text>
</svg>
