<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Default box art for RnRomManager (Commodore VIC-20). Made for this project; MIT licensed like the rest of the repo.
       A generic 8-bit home computer with a plug-in cartridge: no logo or trade dress. Exported to vic20.png (512x512): see README.md. -->
  <rect width="512" height="512" fill="#ece6e2"/>
  <!-- cartridge -->
  <g transform="rotate(-6 256 150)">
    <rect x="166" y="70" width="180" height="150" rx="10" fill="#4a4540" stroke="#2a2622" stroke-width="5"/>
    <rect x="190" y="92" width="132" height="70" rx="6" fill="#f2f0e6"/>
    <rect x="206" y="108" width="100" height="10" rx="3" fill="#8a3a2e"/>
    <rect x="206" y="128" width="70" height="10" rx="3" fill="#8a3a2e"/>
    <g fill="#c9a94a">
      <rect x="196" y="196" width="10" height="24"/><rect x="214" y="196" width="10" height="24"/>
      <rect x="232" y="196" width="10" height="24"/><rect x="250" y="196" width="10" height="24"/>
      <rect x="268" y="196" width="10" height="24"/><rect x="286" y="196" width="10" height="24"/>
      <rect x="304" y="196" width="10" height="24"/>
    </g>
  </g>
  <!-- computer body -->
  <path d="M64 290 Q70 266 98 266 L414 266 Q442 266 448 290 L470 398 Q472 416 452 416 L60 416 Q40 416 42 398 Z"
        fill="#e8dfc8" stroke="#6f6650" stroke-width="5" stroke-linejoin="round"/>
  <!-- keyboard -->
  <rect x="86" y="292" width="340" height="104" rx="8" fill="#4a4540"/>
  <g fill="#7a716a">
    <rect x="96" y="302" width="28" height="18" rx="3"/><rect x="130" y="302" width="28" height="18" rx="3"/>
    <rect x="164" y="302" width="28" height="18" rx="3"/><rect x="198" y="302" width="28" height="18" rx="3"/>
    <rect x="232" y="302" width="28" height="18" rx="3"/><rect x="266" y="302" width="28" height="18" rx="3"/>
    <rect x="300" y="302" width="28" height="18" rx="3"/><rect x="334" y="302" width="28" height="18" rx="3"/>
    <rect x="104" y="326" width="28" height="18" rx="3"/><rect x="138" y="326" width="28" height="18" rx="3"/>
    <rect x="172" y="326" width="28" height="18" rx="3"/><rect x="206" y="326" width="28" height="18" rx="3"/>
    <rect x="240" y="326" width="28" height="18" rx="3"/><rect x="274" y="326" width="28" height="18" rx="3"/>
    <rect x="308" y="326" width="28" height="18" rx="3"/><rect x="342" y="326" width="28" height="18" rx="3"/>
    <rect x="112" y="350" width="28" height="18" rx="3"/><rect x="146" y="350" width="28" height="18" rx="3"/>
    <rect x="180" y="350" width="28" height="18" rx="3"/><rect x="214" y="350" width="28" height="18" rx="3"/>
    <rect x="248" y="350" width="28" height="18" rx="3"/><rect x="282" y="350" width="28" height="18" rx="3"/>
    <rect x="316" y="350" width="28" height="18" rx="3"/><rect x="350" y="350" width="28" height="18" rx="3"/>
    <rect x="160" y="374" width="170" height="16" rx="3"/>
  </g>
  <g fill="#c98a3a">
    <rect x="380" y="302" width="36" height="18" rx="3"/><rect x="380" y="326" width="36" height="18" rx="3"/>
    <rect x="388" y="350" width="28" height="18" rx="3"/>
  </g>
  <!-- power light -->
  <circle cx="76" cy="282" r="5" fill="#d9534f"/>
  <text x="256" y="476" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="34" font-weight="700" letter-spacing="4" fill="#8a3a2e">VIC-20</text>
</svg>
