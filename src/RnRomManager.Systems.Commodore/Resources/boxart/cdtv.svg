<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Default box art for RnRomManager (Commodore CDTV). Made for this project; MIT licensed like the rest of
       the repo. A generic disc caddy: no logo or trade dress. Exported to cdtv.png (512x512): see README.md. -->
  <rect width="512" height="512" fill="#efe9e0"/>
  <!-- caddy -->
  <rect x="66" y="80" width="380" height="352" rx="12" fill="#2b2620" stroke="#15120f" stroke-width="4"/>
  <rect x="86" y="100" width="340" height="250" rx="6" fill="#40362a"/>
  <!-- compact disc through the window -->
  <circle cx="256" cy="225" r="108" fill="#c9ccd6" stroke="#2a2a30" stroke-width="4"/>
  <circle cx="256" cy="225" r="86" fill="none" stroke="#e8eaf0" stroke-width="10"/>
  <circle cx="256" cy="225" r="60" fill="none" stroke="#a7abb8" stroke-width="6"/>
  <circle cx="256" cy="225" r="30" fill="#40362a" stroke="#2a2a30" stroke-width="4"/>
  <circle cx="256" cy="225" r="10" fill="#efe9e0" stroke="#2a2a30" stroke-width="3"/>
  <!-- shutter rails -->
  <rect x="86" y="100" width="340" height="14" fill="#8a7c68"/>
  <rect x="86" y="336" width="340" height="14" fill="#8a7c68"/>
  <!-- label strip -->
  <rect x="86" y="364" width="340" height="52" rx="6" fill="#fbf8f3"/>
  <text x="256" y="404" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="38" font-weight="800" fill="#40362a">CDTV</text>
</svg>
