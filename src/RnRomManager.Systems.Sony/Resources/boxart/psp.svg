<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Default box art for RnRomManager (PlayStation Portable). Made for this project; MIT licensed like the rest of the repo.
       Exported to psp.png (512x512): see README.md. -->
  <rect width="512" height="512" fill="#dde3ea"/>
  <!-- long black handheld -->
  <rect x="28" y="168" width="456" height="176" rx="88" fill="#16171b" stroke="#000000" stroke-width="4"/>
  <!-- wide screen -->
  <rect x="148" y="190" width="216" height="132" rx="6" fill="#3b4a66"/>
  <text x="256" y="270" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff">PSP</text>
  <!-- d-pad -->
  <g fill="#3a3c44">
    <rect x="66" y="246" width="54" height="18" rx="3"/>
    <rect x="84" y="228" width="18" height="54" rx="3"/>
  </g>
  <!-- four face buttons -->
  <g fill="#3a3c44">
    <circle cx="420" cy="230" r="11"/><circle cx="420" cy="282" r="11"/>
    <circle cx="394" cy="256" r="11"/><circle cx="446" cy="256" r="11"/>
  </g>
</svg>
