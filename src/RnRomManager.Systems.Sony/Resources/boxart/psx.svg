<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Default box art for RnRomManager (PlayStation). Made for this project; MIT licensed like the rest of the repo.
       Exported to psx.png (512x512): see README.md. -->
  <rect width="512" height="512" fill="#e6e6ea"/>
  <!-- grey console body with a round lid -->
  <rect x="56" y="150" width="400" height="230" rx="18" fill="#b9b9c0" stroke="#7d7d86" stroke-width="4"/>
  <circle cx="200" cy="265" r="92" fill="#a6a6ae" stroke="#7d7d86" stroke-width="4"/>
  <!-- disc under the lid -->
  <circle cx="200" cy="265" r="70" fill="#2b2b33"/>
  <circle cx="200" cy="265" r="14" fill="#a6a6ae"/>
  <!-- power / reset / open buttons -->
  <circle cx="340" cy="210" r="14" fill="#5c5c66"/>
  <circle cx="390" cy="210" r="14" fill="#5c5c66"/>
  <rect x="320" y="300" width="96" height="40" rx="8" fill="#5c5c66"/>
  <text x="368" y="328" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#ffffff">PSX</text>
</svg>
