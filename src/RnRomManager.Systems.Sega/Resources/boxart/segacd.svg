<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Default box art for RnRomManager (Sega CD). Made for this project; MIT licensed like the rest of the repo.
       Exported to segacd.png (512x512): see README.md. -->
  <rect width="512" height="512" fill="#f0e6ea"/>
  <!-- black console base with a front-loading tray -->
  <rect x="60" y="300" width="392" height="120" rx="16" fill="#1c1c20" stroke="#0b0b0d" stroke-width="4"/>
  <rect x="96" y="332" width="220" height="14" rx="4" fill="#3a3a42"/>
  <circle cx="400" cy="340" r="10" fill="#c8102e"/>
  <!-- compact disc -->
  <circle cx="256" cy="186" r="118" fill="#c9ccd6" stroke="#2a2a30" stroke-width="4"/>
  <circle cx="256" cy="186" r="96" fill="none" stroke="#e8eaf0" stroke-width="10"/>
  <circle cx="256" cy="186" r="70" fill="none" stroke="#a7abb8" stroke-width="6"/>
  <circle cx="256" cy="186" r="36" fill="#c8102e" stroke="#2a2a30" stroke-width="4"/>
  <circle cx="256" cy="186" r="12" fill="#f0e6ea" stroke="#2a2a30" stroke-width="3"/>
  <text x="256" y="400" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#ffffff">Sega CD</text>
</svg>
