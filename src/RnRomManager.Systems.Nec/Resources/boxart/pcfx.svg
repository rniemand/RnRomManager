<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Default box art for RnRomManager (PC-FX). Made for this project; MIT licensed like the rest of
       the repo. Exported to pcfx.png (512x512): see README.md. -->
  <rect width="512" height="512" fill="#f3e6ef"/>
  <!-- jewel case -->
  <rect x="76" y="64" width="360" height="384" rx="14" fill="#1d2528" stroke="#0e1314" stroke-width="4"/>
  <rect x="96" y="84" width="320" height="270" rx="8" fill="#7a1f5c"/>
  <!-- compact disc on the case -->
  <circle cx="256" cy="219" r="112" fill="#c9ccd6" stroke="#2a2a30" stroke-width="4"/>
  <circle cx="256" cy="219" r="90" fill="none" stroke="#e8eaf0" stroke-width="10"/>
  <circle cx="256" cy="219" r="64" fill="none" stroke="#a7abb8" stroke-width="6"/>
  <circle cx="256" cy="219" r="34" fill="#7a1f5c" stroke="#2a2a30" stroke-width="4"/>
  <circle cx="256" cy="219" r="11" fill="#f3e6ef" stroke="#2a2a30" stroke-width="3"/>
  <!-- label strip -->
  <rect x="96" y="370" width="320" height="58" rx="6" fill="#fafdfc"/>
  <text x="256" y="414" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="40" font-weight="800" fill="#7a1f5c">PC-FX</text>
</svg>
