<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Default box art for RnRomManager (Nintendo 3DS). Made for this project; MIT licensed like the rest of the repo.
       Exported to 3ds.png (512x512): see README.md. -->
  <rect width="512" height="512" fill="#fbe3ec"/>
  <!-- open clamshell: upper half with the wide screen -->
  <rect x="116" y="52" width="280" height="180" rx="18" fill="#c2255c" stroke="#5c0f2c" stroke-width="5"/>
  <rect x="140" y="72" width="232" height="140" rx="4" fill="#1d2228"/>
  <rect x="148" y="80" width="216" height="124" fill="#8fc7e8"/>
  <circle cx="256" cy="64" r="4" fill="#1d2228"/>
  <!-- hinge -->
  <rect x="126" y="230" width="260" height="18" rx="8" fill="#5c0f2c"/>
  <!-- lower half -->
  <rect x="116" y="246" width="280" height="180" rx="18" fill="#c2255c" stroke="#5c0f2c" stroke-width="5"/>
  <rect x="198" y="266" width="116" height="90" rx="3" fill="#1d2228"/>
  <rect x="204" y="272" width="104" height="78" fill="#cfe8b8"/>
  <!-- circle pad and d-pad -->
  <circle cx="160" cy="290" r="18" fill="#3a3f45" stroke="#1d2228" stroke-width="3"/>
  <path d="M146 340h12v-12h10v12h12v10h-12v12h-10v-12h-12z" fill="#1d2228"/>
  <!-- face buttons -->
  <circle cx="356" cy="282" r="8" fill="#1d2228"/>
  <circle cx="372" cy="298" r="8" fill="#1d2228"/>
  <circle cx="340" cy="298" r="8" fill="#1d2228"/>
  <circle cx="356" cy="314" r="8" fill="#1d2228"/>
  <!-- home button row -->
  <rect x="216" y="386" width="80" height="12" rx="6" fill="#5c0f2c"/>
  <text x="256" y="480" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="30" font-weight="700" letter-spacing="3" fill="#5c0f2c">NINTENDO 3DS</text>
</svg>
